<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>B2 Prüfung — Druckversion</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ---- Print page chrome ---- */
    html, body { background: #fff; }
    .print-page {
      position: relative;
      background: #fff;
      padding: 0 0 34px;
      break-after: page;
      break-inside: avoid;
    }
    .print-page:last-child { break-after: auto; }

    .print-secbar {
      background: linear-gradient(180deg, var(--c-section-1), var(--c-section-2));
      color: #fff;
      padding: 11px 26px;
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 18px;
    }
    .print-secbar .t { font-size: 20px; font-weight: 700; }
    .print-secbar .sub { font-weight: 400; }
    .print-secbar .mod { margin-left: auto; font-size: 13px; opacity: .85; }

    .print-body { padding: 0 26px; }

    /* Let the readers expand — no internal scroll in print */
    .print-page .reader,
    .print-page .write-task,
    .print-page .write-area {
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .print-page .write-area { min-height: 320px; }
    .print-page .work,
    .print-page .write-grid { max-width: none; }

    /* Keep the on-screen two-column layout in print (override responsive collapse) */
    .print-page .work {
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) !important;
      gap: 34px !important;
    }
    .print-page .write-grid {
      grid-template-columns: 1fr 1fr !important;
      gap: 26px !important;
    }
    .print-page .reader.cols .reader-cols {
      grid-template-columns: 1fr 1fr !important;
    }

    /* Cover */
    .cover {
      break-after: page;
      padding: 90px 60px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }
    .cover .logo { width: 168px; height: 100px; }
    .cover .logo .logo-mark { font-size: 48px; }
    .cover h1 { font-size: 40px; margin: 18px 0 0; color: #16293f; }
    .cover .lead { font-size: 18px; color: #444; max-width: 640px; line-height: 1.5; }
    .cover .meta-grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 8px 18px;
      font-size: 16px;
      max-width: 520px;
    }
    .cover .meta-grid .k { color: #777; }
    .cover .meta-grid .v { font-weight: 700; color: #16293f; }
    .cover .toc { margin-top: 18px; font-size: 15px; color: #333; line-height: 1.8; }
    .cover .toc b { color: #16293f; }

    @media screen {
      body { background: #d8d8d8; }
      .print-page, .cover { box-shadow: 0 2px 14px rgba(0,0,0,.18); margin: 18px auto; max-width: 1180px; }
      .print-hint {
        position: fixed; top: 14px; right: 16px; z-index: 50;
        background: #16293f; color: #fff; border: none; border-radius: 6px;
        padding: 10px 18px; font: 700 14px var(--font); cursor: pointer;
      }
    }
    @media print {
      .print-hint { display: none; }
      @page { size: A4 landscape; margin: 0.6cm; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      .opt .opt-box:hover, .bank-box:hover, .mail-head:hover,
      .sb1-row:hover { background: var(--c-option) !important; }
    }
  </style>
</head>
<body>
  <button class="print-hint" onclick="window.print()">Als PDF speichern</button>

  <!-- Cover -->
  <section class="cover">
    <div class="logo"><span class="logo-mark">df</span><span class="logo-sub">SPRACHTRAINING</span></div>
    <h1>Prüfung B2 — Deutsch</h1>
    <p class="lead">Modellsatz: Leseverstehen, Sprachbausteine, Hörverstehen und Schreiben. Druckversion zur Bearbeitung auf Papier.</p>
    <div class="meta-grid">
      <span class="k">Niveau</span><span class="v">Deutsch — B2</span>
      <span class="k">Teilnehmer/in</span><span class="v" id="cover-user">—</span>
      <span class="k">Datum</span><span class="v" id="cover-date">—</span>
    </div>
    <div class="toc" id="cover-toc"></div>
  </section>

  <div id="print-root"></div>

  <script>window.EXAM_PRINT_MODE = true;</script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      var DATA = window.EXAM_DATA;
      var root = document.getElementById("print-root");

      document.getElementById("cover-user").textContent = DATA.candidate;
      document.getElementById("cover-date").textContent =
        new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });

      var toc = [];
      DATA.modules.forEach(function (mod, mi) {
        mod.parts.forEach(function (p, pi) {
          toc.push('<div><b>' + p.title[0] + ', ' + p.title[1] + '</b> — ' + p.tab[2] + '</div>');

          var page = document.createElement("section");
          page.className = "print-page";

          var bar = document.createElement("div");
          bar.className = "print-secbar";
          bar.innerHTML =
            '<span class="t">' + p.title[0] + '</span>' +
            '<span class="sub">, ' + p.title[1] + ' &nbsp; ' + p.tab[2] + '</span>' +
            '<span class="mod">' + mod.name + (mod.timeTotal ? ' · ' + mod.timeTotal : '') + '</span>';
          page.appendChild(bar);

          var bodyWrap = document.createElement("div");
          bodyWrap.className = "print-body";

          var instr = document.createElement("div");
          instr.className = "instruction";
          instr.innerHTML = "<p>" + p.instruction + "</p>";
          bodyWrap.appendChild(instr);

          var built = window.EXAM_BUILD_PART(mi, pi);
          bodyWrap.appendChild(built.node);

          page.appendChild(bodyWrap);
          root.appendChild(page);
        });
      });

      document.getElementById("cover-toc").innerHTML =
        "<div style='margin-bottom:6px;color:#16293f;font-weight:700'>Inhalt</div>" + toc.join("");

      // auto-print once fonts + layout settle
      function go() { setTimeout(function () { window.print(); }, 500); }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(go);
      else window.addEventListener("load", go);
    })();
  </script>
</body>
</html>
